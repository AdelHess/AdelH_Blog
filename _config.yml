title: Your Name
email: ""
description: "Personal notes and practical perspectives on advertising measurement."
url: "https://your-site.netlify.app"
baseurl: ""
lang: en-US

author:
  name: Your Name
  field: Advertising Measurement
  image: /assets/images/profile.jpg
  linkedin: https://www.linkedin.com/in/yourprofile

markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/
excerpt_separator: "<!--more-->"

paginate: 5
paginate_path: "/page/:num/"

plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
  - netlify.toml
  - .jekyll-cache

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      image: /assets/images/profile.jpg
